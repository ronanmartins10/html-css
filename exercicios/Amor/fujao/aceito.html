<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Encontro Marcado 💘</title>
  <style>
    body {
      background: linear-gradient(to right, #400ca0, #5a2faa);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      color: #fff;
      padding: 50px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      font-size: 1.5em;
      margin: 20px 0;
      animation: fadeIn 3s ease-in-out;
    }

    .heart {
      font-size: 4em;
      animation: beat 1s infinite;
      color: red;
      margin: 20px 0;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button {
      background-color: #fff;
      color: #ff4d6d;
      padding: 10px 20px;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 30px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #ffe6ea;
    }
  </style>
</head>
<body>

  <h1>💘 Encontro Marcado 💘</h1>
  <p>Temos um encontro marcado na <strong id="lugar">Pizzaria Buoni Amici </strong></p>
  <p>📅 No dia <strong id="data">12 de Junho</strong>, às <strong id="hora">18 horas</strong></p>

  <div class="heart">❤️</div>

</body>
</html>
